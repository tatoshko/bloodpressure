services:
  bot:
    platform: linux/amd64
    image: tatoshko/bloodpressure-bot:latest
    container_name: bloodPressureBot
    environment:
      PG_HOST: db
      PG_PORT: ${PG_PORT:-5432}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
    env_file:
      - .env
    ports:
      - "127.0.0.1:${SERVER_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: ${PG_NAME}
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d/
      - bloodpressure_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  bloodpressure_pgdata:
